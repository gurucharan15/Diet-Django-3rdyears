<!DOCTYPE html>
<html>
<head>
    <title>Form Handled Result</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            padding: 30px;
        }
        .box {
            background: white;
            max-width: 420px;
            margin: 0 auto;
            padding: 24px;
            border-radius: 8px;
            border-top: 5px solid #28a745;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        h2 { color: #28a745; margin-top: 0; }
        .data-row { margin: 12px 0; font-size: 15px; }
        .badge {
            background: #e7f3ff;
            color: #007bff;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
        }
        a {
            display: inline-block;
            margin-top: 15px;
            color: #007bff;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="box">
        <h2>✔ Form Handled Successfully</h2>
        <p><strong>HTTP Method:</strong> <span class="badge">{{ method }}</span></p>

        <div class="data-row">
            <strong>Validated Name:</strong> {{ name }}
        </div>
        <div class="data-row">
            <strong>Validated Phone:</strong> {{ phone }}
        </div>

        <a href="{% url 'form_demo' %}">&larr; Back to Form</a>
    </div>

</body>
</html>
